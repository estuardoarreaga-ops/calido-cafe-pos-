# Nombre de la aplicacion
spring.application.name=franquicia

# Puerto dinamico de Render
server.port=${PORT:8080}

# ===================================================================
# CONFIGURACION DE BASE DE DATOS POSTGRESQL (RENDER / NUBE)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:posdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Hibernate / JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2
spring.h2.console.enabled=true

# ===================================================================
# CONFIGURACION DE TUNELES Y ENCABEZADOS
# ===================================================================
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.relax-query-chars=|,{}