# Nombre de la aplicacion
spring.application.name=franquicia

# Configuracion de Base de Datos para pruebas locales (H2 en memoria)
spring.datasource.url=jdbc:h2:mem:posdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web para ver la Base de Datos desde el navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Hibernate/JPA: Crea y actualiza las tablas SQL automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURACION FUTURA PARA POSTGRESQL (NUBE / PRODUCCION)
# ===================================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/pos_franquicia
# spring.datasource.username=postgres
# spring.datasource.password=tu_contrasena
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURACION PARA TUNELES (localhost.run / ngrok)
# ===================================================================
server.forward-headers-strategy=framework

# Configuracion de Tomcat para aceptar encabezados remotos
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Evitar restricciones de caracteres en consultas
server.tomcat.relax-query-chars=|,{}