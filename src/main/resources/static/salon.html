<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salón y Mesas - POS Cafetería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body * { visibility: hidden; }
            #areaFactura, #areaFactura * { visibility: visible; }
            #areaFactura { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 p-3 md:p-6 font-sans h-screen flex flex-col box-border">

<!-- Header Salón -->
<div class="flex justify-between items-center mb-4 no-print">
    <div>
        <h2 class="text-lg md:text-xl font-bold text-slate-800">Salón y Mesas</h2>
        <p class="text-xs text-slate-500">Monitoreo de consumos y cobro de cuentas</p>
    </div>
    <button onclick="cargarEstadoMesas()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-rotate"></i> Actualizar
    </button>
</div>

<!-- Grilla de Mesas -->
<div id="gridMesas" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 md:gap-4 overflow-y-auto flex-1 no-print"></div>

<!-- Modal Detalle Mesa -->
<div id="modalDetalleMesa" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex justify-center items-center z-50 p-4 no-print">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
            <h3 class="text-base font-bold text-slate-800" id="lblModalMesaTitulo">Mesa #1</h3>
            <span id="lblModalMesaEstado" class="text-xs font-bold px-2 py-0.5 rounded-full"></span>
        </div>

        <div id="listaItemsMesa" class="space-y-1.5 max-h-[200px] overflow-y-auto text-xs border-b pb-3"></div>

        <div class="flex justify-between items-center text-slate-900 font-bold text-base">
            <span>Total a Cuentas:</span>
            <span id="lblModalMesaTotal" class="text-indigo-600">Q 0.00</span>
        </div>

        <!-- Datos de Facturación -->
        <div class="space-y-2 pt-1 border-t">
            <p class="text-xs font-bold text-slate-700">Datos para Facturación / Ticket:</p>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 mb-0.5">NIT / CUI:</label>
                    <input type="text" id="txtNitClienteMesa" value="CF" class="w-full p-1.5 border rounded-lg text-xs font-bold bg-slate-50 uppercase">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Nombre Cliente:</label>
                    <input type="text" id="txtNombreClienteMesa" value="Consumidor Final" class="w-full p-1.5 border rounded-lg text-xs font-bold bg-slate-50">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
            <button onclick="cerrarModal('modalDetalleMesa')" class="px-3 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">Cerrar</button>
            <button id="btnCobrarMesa" onclick="procesarCobroYMesaFactura()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1">
                <i class="fa-solid fa-cash-register"></i> Cobrar y Facturar
            </button>
        </div>
    </div>
</div>

<!-- Modal Factura / Ticket Final -->
<div id="modalFacturaMesa" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex justify-center items-center z-50 p-4">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-2xl space-y-3 text-center">

        <div id="areaFactura" class="text-left font-mono text-[11px] space-y-2 text-slate-800 p-3 border-dashed border rounded-xl bg-slate-50"></div>

        <div class="flex justify-center gap-2 pt-1 no-print">
            <button onclick="finalizarYLiberarMesa()" class="px-3 py-1.5 bg-slate-200 text-slate-800 font-bold rounded-xl text-xs">Finalizar y Liberar</button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs flex items-center gap-1">
                <i class="fa-solid fa-print"></i> Imprimir
            </button>
        </div>
    </div>
</div>

<script>
    let mesaSeleccionadaId = null;
    let consumoMesaActual = null;

    function cargarEstadoMesas() {
        const grid = document.getElementById('gridMesas');
        grid.innerHTML = '';

        for (let i = 1; i <= 5; i++) {
            const ordenMesaRaw = localStorage.getItem(`orden_mesa_${i}`);
            let estaOcupada = false;
            let totalAcumulado = 0;
            let numArticulos = 0;

            if (ordenMesaRaw) {
                try {
                    const data = JSON.parse(ordenMesaRaw);
                    if (data.items && data.items.length > 0) {
                        estaOcupada = true;
                        data.items.forEach(it => {
                            totalAcumulado += (it.precioVenta * it.cantidad);
                            numArticulos += it.cantidad;
                        });
                    }
                } catch(e){}
            }

            grid.innerHTML += `
                <button onclick="abrirDetalleMesa(${i})" class="p-4 rounded-2xl border transition text-left flex flex-col justify-between h-36 ${estaOcupada ? 'bg-amber-50 border-amber-300 shadow-md' : 'bg-white border-slate-200 hover:border-indigo-400'}">
                    <div class="flex justify-between items-start w-full">
                        <span class="font-bold text-slate-800 text-sm">Mesa #${i}</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${estaOcupada ? 'bg-amber-500 text-white' : 'bg-emerald-100 text-emerald-800'}">
                            ${estaOcupada ? 'OCUPADA' : 'LIBRE'}
                        </span>
                    </div>
                    <div>
                        ${estaOcupada ? `
                            <p class="text-[11px] font-semibold text-amber-800">${numArticulos} producto(s)</p>
                            <p class="text-base font-extrabold text-amber-900 mt-1">Q ${totalAcumulado.toFixed(2)}</p>
                        ` : `
                            <p class="text-xs text-slate-400">Disponible</p>
                        `}
                    </div>
                </button>
            `;
        }
    }

    function abrirDetalleMesa(id) {
        mesaSeleccionadaId = id;
        document.getElementById('lblModalMesaTitulo').innerText = `Mesa #${id}`;
        const ordenMesaRaw = localStorage.getItem(`orden_mesa_${id}`);
        const contenedorList = document.getElementById('listaItemsMesa');
        const lblEstado = document.getElementById('lblModalMesaEstado');
        const btnCobrar = document.getElementById('btnCobrarMesa');

        if (!ordenMesaRaw) {
            consumoMesaActual = null;
            lblEstado.innerText = 'LIBRE';
            lblEstado.className = 'text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800';
            contenedorList.innerHTML = `<p class="text-center text-slate-400 py-4">Mesa disponible.</p>`;
            document.getElementById('lblModalMesaTotal').innerText = 'Q 0.00';
            btnCobrar.disabled = true;
            btnCobrar.classList.add('opacity-50');
        } else {
            consumoMesaActual = JSON.parse(ordenMesaRaw);
            lblEstado.innerText = 'OCUPADA';
            lblEstado.className = 'text-xs font-bold px-2 py-0.5 rounded-full bg-amber-500 text-white';
            btnCobrar.disabled = false;
            btnCobrar.classList.remove('opacity-50');

            let total = 0;
            contenedorList.innerHTML = '';
            consumoMesaActual.items.forEach(it => {
                const sub = it.precioVenta * it.cantidad;
                total += sub;
                contenedorList.innerHTML += `
                    <div class="flex justify-between py-1 border-b border-slate-100">
                        <span>${it.cantidad}x ${it.nombre}</span>
                        <span class="font-bold">Q ${sub.toFixed(2)}</span>
                    </div>
                `;
            });
            document.getElementById('lblModalMesaTotal').innerText = `Q ${total.toFixed(2)}`;
        }

        document.getElementById('modalDetalleMesa').classList.remove('hidden');
    }

    function procesarCobroYMesaFactura() {
        if (!consumoMesaActual || !mesaSeleccionadaId) return;

        const nit = document.getElementById('txtNitClienteMesa').value || 'CF';
        const nombre = document.getElementById('txtNombreClienteMesa').value || 'Consumidor Final';

        const area = document.getElementById('areaFactura');
        let total = 0;
        let htmlItems = '';

        consumoMesaActual.items.forEach(i => {
            const sub = i.precioVenta * i.cantidad;
            total += sub;
            htmlItems += `<div class="flex justify-between"><span>${i.cantidad}x ${i.nombre}</span><span>Q ${sub.toFixed(2)}</span></div>`;
        });

        area.innerHTML = `
            <div class="text-center font-bold">
                <p class="text-xs uppercase tracking-wide">Cafetería Franquicia #1</p>
                <p class="text-[9px] text-slate-500">Ticket de Venta - Mesa #${mesaSeleccionadaId}</p>
                <p class="text-[9px] text-slate-500">${new Date().toLocaleString()}</p>
            </div>
            <div class="text-[10px] border-t border-b border-dashed py-1 my-1">
                <p><strong>NIT:</strong> ${nit.toUpperCase()}</p>
                <p class="truncate"><strong>Cliente:</strong> ${nombre}</p>
            </div>
            <div class="space-y-1">${htmlItems}</div>
            <hr class="border-dashed my-1">
            <div class="flex justify-between font-bold text-xs">
                <span>TOTAL PAGADO:</span>
                <span>Q ${total.toFixed(2)}</span>
            </div>
            <p class="text-[9px] text-center text-slate-400 mt-2">¡Gracias por su preferencia!</p>
        `;

        cerrarModal('modalDetalleMesa');
        document.getElementById('modalFacturaMesa').classList.remove('hidden');
    }

    function finalizarYLiberarMesa() {
        if (mesaSeleccionadaId) {
            localStorage.removeItem(`orden_mesa_${mesaSeleccionadaId}`);
            alert(`✅ Venta procesada y Mesa #${mesaSeleccionadaId} liberada.`);
        }
        cerrarModal('modalFacturaMesa');
        cargarEstadoMesas();
    }

    function cerrarModal(id) {
        document.getElementById(id).classList.add('hidden');
    }

    window.onload = cargarEstadoMesas;
</script>
</body>
</html>
