<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - Pantalla de Cocina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white p-4 h-screen flex flex-col font-sans overflow-hidden">

<!-- Header -->
<div class="flex justify-between items-center pb-4 border-b border-slate-800">
    <div class="flex items-center gap-3">
        <h1 class="text-xl font-black text-amber-500 tracking-wide flex items-center gap-2">
            <i class="fa-solid fa-utensils"></i> COCINA / BARRA (KDS)
        </h1>
        <span id="lblConexion" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">
                🟢 En Línea
            </span>
    </div>
    <div class="text-xs font-bold text-slate-400" id="lblReloj">00:00 AM</div>
</div>

<!-- Grid de Comandas -->
<div id="gridKds" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 flex-1 overflow-y-auto pt-4"></div>

<script>
    let ultimasComandasIds = [];

    function actualizarReloj() {
        document.getElementById('lblReloj').innerText = new Date().toLocaleTimeString();
    }
    setInterval(actualizarReloj, 1000);

    // FUNCIÓN PRINCIPAL: CONSULTAR AL SERVIDOR SPRING BOOT
    async function cargarComandasDesdeServidor() {
        try {
            const res = await fetch('/api/comandas');
            if (!res.ok) throw new Error("Error en servidor");

            const comandas = await res.json();
            document.getElementById('lblConexion').className = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase";
            document.getElementById('lblConexion').innerText = "🟢 En Línea";

            // Detectar si hay comandas nuevas para sonar alerta
            const idsActuales = comandas.map(c => c.id);
            const hayNuevas = idsActuales.some(id => !ultimasComandasIds.includes(id));

            if (hayNuevas && ultimasComandasIds.length > 0) {
                reproducirSonidoAlerta();
            }
            ultimasComandasIds = idsActuales;

            renderizarComandas(comandas);
        } catch (error) {
            document.getElementById('lblConexion').className = "bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase";
            document.getElementById('lblConexion').innerText = "🔴 Reconectando...";
        }
    }

    function renderizarComandas(comandas) {
        const grid = document.getElementById('gridKds');
        grid.innerHTML = '';

        if (comandas.length === 0) {
            grid.innerHTML = `
                <div class="col-span-full flex flex-col justify-center items-center text-slate-600 space-y-2 py-20">
                    <i class="fa-solid fa-check-circle text-4xl"></i>
                    <p class="font-bold text-sm">No hay comandas pendientes</p>
                </div>
            `;
            return;
        }

        comandas.forEach(c => {
            let htmlItems = '';
            (c.items || []).forEach(it => {
                const extras = it.extras && it.extras.length > 0 ? `<br><span class="text-amber-400 text-[10px]">+ ${it.extras.join(', ')}</span>` : '';
                htmlItems += `
                    <li class="py-1.5 border-b border-slate-700/50 flex justify-between items-start text-xs">
                        <span class="font-bold text-slate-200"><b class="text-amber-400 text-sm mr-1.5">${it.cantidad}x</b> ${it.nombre}${extras}</span>
                    </li>
                `;
            });

            grid.innerHTML += `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 flex flex-col justify-between shadow-lg h-fit space-y-3">
                    <div>
                        <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-2">
                            <span class="font-black text-amber-400 text-sm">${c.mesa}</span>
                            <span class="text-[10px] font-bold text-slate-400 bg-slate-700/50 px-2 py-0.5 rounded-md">${c.hora || ''}</span>
                        </div>
                        <p class="text-xs font-bold text-slate-300 mb-2"><i class="fa-solid fa-user text-slate-500 mr-1"></i> ${c.cliente || 'Cliente'}</p>
                        <ul class="space-y-0.5">${htmlItems}</ul>
                    </div>
                    <button onclick="completarComanda('${c.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-2.5 rounded-xl text-xs flex justify-center items-center gap-2 shadow transition">
                        <i class="fa-solid fa-check"></i> Despachar / Listo
                    </button>
                </div>
            `;
        });
    }

    async function completarComanda(id) {
        try {
            await fetch(`/api/comandas/${id}/estado`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: 'COMPLETADO' })
            });
            cargarComandasDesdeServidor();
        } catch (e) {
            alert("Error al actualizar la comanda.");
        }
    }

    function reproducirSonidoAlerta() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } catch(e){}
    }

    // Consultar al servidor automáticamente cada 3 segundos
    setInterval(cargarComandasDesdeServidor, 3000);
    cargarComandasDesdeServidor();
</script>
</body>
</html>
