<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Proveedores e Insumos - POS Cafetería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 p-3 md:p-6 font-sans h-screen flex flex-col box-border overflow-y-auto">

<!-- Encabezado -->
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
    <div>
        <h2 class="text-lg md:text-xl font-bold text-slate-800">Proveedores e Insumos</h2>
        <p class="text-xs text-slate-500">Directorio de proveedores y registro de facturas de compra</p>
    </div>
    <div class="flex gap-2">
        <button onclick="abrirModalRegistrarCompra()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
            <i class="fa-solid fa-file-invoice-dollar"></i> Registrar Factura de Compra
        </button>
        <button onclick="abrirModalNuevoProveedor()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
            <i class="fa-solid fa-truck-field"></i> Nuevo Proveedor
        </button>
    </div>
</div>

<!-- Pestañas y Tablas -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

    <!-- Tabla Directorio de Proveedores -->
    <div class="lg:col-span-1 bg-white rounded-2xl shadow p-4 space-y-3">
        <h3 class="text-sm font-bold text-slate-800 border-b pb-2 flex items-center gap-2">
            <i class="fa-solid fa-address-book text-indigo-600"></i> Directorio de Proveedores
        </h3>

        <div id="listaProveedores" class="space-y-2 text-xs max-h-[420px] overflow-y-auto"></div>
    </div>

    <!-- Tabla Historial de Compras y Insumos -->
    <div class="lg:col-span-2 bg-white rounded-2xl shadow p-4 space-y-3">
        <h3 class="text-sm font-bold text-slate-800 border-b pb-2 flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-emerald-600"></i> Historial de Compras de Insumos
        </h3>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-700">
                <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b">
                <tr>
                    <th class="p-2.5">Fecha</th>
                    <th class="p-2.5">Proveedor</th>
                    <th class="p-2.5">Insumo / Descripción</th>
                    <th class="p-2.5">No. Factura</th>
                    <th class="p-2.5 text-right">Monto Total (Q)</th>
                </tr>
                </thead>
                <tbody id="tbodyHistorialCompras" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Nuevo Proveedor -->
<div id="modalProveedor" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex justify-center items-center z-50 p-4">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4">
        <h3 class="text-base font-bold text-slate-800 border-b pb-2">Registrar Proveedor</h3>

        <div class="space-y-3 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Nombre Comercial / Empresa:</label>
                <input type="text" id="txtProvEmpresa" placeholder="Ej: Café Beneficio Xela" class="w-full p-2 border rounded-xl bg-slate-50 font-bold">
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">Insumo Principal:</label>
                <input type="text" id="txtProvInsumo" placeholder="Ej: Café en grano, Leches, Jarabes..." class="w-full p-2 border rounded-xl bg-slate-50">
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">Teléfono / Nombre Contacto:</label>
                <input type="text" id="txtProvContacto" placeholder="Ej: 5555-1234 - Don Pedro" class="w-full p-2 border rounded-xl bg-slate-50">
            </div>
        </div>

        <div class="flex justify-end gap-2 border-t pt-3">
            <button onclick="cerrarModal('modalProveedor')" class="px-3 py-1.5 text-xs font-semibold text-slate-600">Cancelar</button>
            <button onclick="guardarProveedor()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs">Guardar Proveedor</button>
        </div>
    </div>
</div>

<!-- Modal Registrar Compra / Factura -->
<div id="modalCompra" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex justify-center items-center z-50 p-4">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4">
        <h3 class="text-base font-bold text-slate-800 border-b pb-2 flex items-center gap-2">
            <i class="fa-solid fa-file-invoice-dollar text-emerald-600"></i> Registrar Factura de Entrada
        </h3>

        <div class="space-y-3 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Seleccionar Proveedor:</label>
                <select id="selectCompraProv" class="w-full p-2 border rounded-xl bg-slate-50 font-bold"></select>
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">Insumo / Descripción de la Compra:</label>
                <input type="text" id="txtCompraDesc" placeholder="Ej: 10 Sacos de Café Geisha 2.5lb" class="w-full p-2 border rounded-xl bg-slate-50">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">No. Factura / Serie:</label>
                    <input type="text" id="txtCompraFactura" placeholder="F-10293" class="w-full p-2 border rounded-xl bg-slate-50 font-mono uppercase">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Monto Total (Q):</label>
                    <input type="number" step="0.50" id="txtCompraMonto" placeholder="0.00" class="w-full p-2 border rounded-xl bg-slate-50 font-bold text-emerald-600">
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-2 border-t pt-3">
            <button onclick="cerrarModal('modalCompra')" class="px-3 py-1.5 text-xs font-semibold text-slate-600">Cancelar</button>
            <button onclick="guardarCompra()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold text-xs">Registrar Compra</button>
        </div>
    </div>
</div>

<script>
    const proveedoresBase = [
        { id: 1, empresa: 'Café Finca San Rafael', insumo: 'Café en Grano (Tueste Medio)', contacto: '5421-9080 (Ing. Morales)' },
        { id: 2, empresa: 'Lácteos Altiplano Xela', insumo: 'Leche Entera y Deslactosada', contacto: '7761-4321 (Don Carlos)' },
        { id: 3, empresa: 'Distribuidora Syrups Guate', insumo: 'Jarabes Vainilla/Caramelo/Matcha', contacto: '2230-1122 (Ventas)' }
    ];

    const comprasBase = [
        { id: 101, fecha: '12/10/2026', proveedor: 'Café Finca San Rafael', desc: '5 Quintales Café Bourbon', factura: 'FAC-8812', monto: 1250.00 },
        { id: 102, fecha: '10/10/2026', proveedor: 'Lácteos Altiplano Xela', desc: '40 Lts Leche Entera + 20 Lts Avena', factura: 'FAC-4401', monto: 420.00 }
    ];

    function obtenerProveedoresLocal() {
        const raw = localStorage.getItem('proveedores_sistema');
        if (raw) { try { return JSON.parse(raw); } catch(e){} }
        localStorage.setItem('proveedores_sistema', JSON.stringify(proveedoresBase));
        return proveedoresBase;
    }

    function obtenerComprasLocal() {
        const raw = localStorage.getItem('compras_insumos_sistema');
        if (raw) { try { return JSON.parse(raw); } catch(e){} }
        localStorage.setItem('compras_insumos_sistema', JSON.stringify(comprasBase));
        return comprasBase;
    }

    function renderData() {
        // Render Proveedores
        const proveedores = obtenerProveedoresLocal();
        const containerProv = document.getElementById('listaProveedores');
        containerProv.innerHTML = '';

        proveedores.forEach(p => {
            containerProv.innerHTML += `
                <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl space-y-1">
                    <p class="font-bold text-slate-800">${p.empresa}</p>
                    <p class="text-[11px] text-indigo-600 font-semibold">${p.insumo}</p>
                    <p class="text-[10px] text-slate-400"><i class="fa-solid fa-phone"></i> ${p.contacto}</p>
                </div>
            `;
        });

        // Render Compras
        const compras = obtenerComprasLocal();
        const tbody = document.getElementById('tbodyHistorialCompras');
        tbody.innerHTML = '';

        compras.forEach(c => {
            tbody.innerHTML += `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-2.5 font-semibold text-slate-500">${c.fecha}</td>
                    <td class="p-2.5 font-bold text-slate-800">${c.proveedor}</td>
                    <td class="p-2.5 text-slate-600">${c.desc}</td>
                    <td class="p-2.5 font-mono text-indigo-600 font-bold">${c.factura}</td>
                    <td class="p-2.5 text-right font-extrabold text-emerald-600">Q ${parseFloat(c.monto).toFixed(2)}</td>
                </tr>
            `;
        });
    }

    function abrirModalNuevoProveedor() {
        document.getElementById('txtProvEmpresa').value = '';
        document.getElementById('txtProvInsumo').value = '';
        document.getElementById('txtProvContacto').value = '';
        abrirModal('modalProveedor');
    }

    function guardarProveedor() {
        const empresa = document.getElementById('txtProvEmpresa').value;
        const insumo = document.getElementById('txtProvInsumo').value;
        const contacto = document.getElementById('txtProvContacto').value;

        if (!empresa) { alert("Ingresa el nombre de la empresa."); return; }

        const provs = obtenerProveedoresLocal();
        provs.push({ id: Date.now(), empresa, insumo, contacto });
        localStorage.setItem('proveedores_sistema', JSON.stringify(provs));

        alert("✅ Proveedor registrado exitosamente.");
        cerrarModal('modalProveedor');
        renderData();
    }

    function abrirModalRegistrarCompra() {
        const provs = obtenerProveedoresLocal();
        const select = document.getElementById('selectCompraProv');
        select.innerHTML = '';
        provs.forEach(p => {
            select.innerHTML += `<option value="${p.empresa}">${p.empresa} (${p.insumo})</option>`;
        });

        document.getElementById('txtCompraDesc').value = '';
        document.getElementById('txtCompraFactura').value = '';
        document.getElementById('txtCompraMonto').value = '';
        abrirModal('modalCompra');
    }

    function guardarCompra() {
        const proveedor = document.getElementById('selectCompraProv').value;
        const desc = document.getElementById('txtCompraDesc').value;
        const factura = document.getElementById('txtCompraFactura').value || 'S/N';
        const monto = parseFloat(document.getElementById('txtCompraMonto').value) || 0;

        if (!desc || monto <= 0) { alert("Ingresa una descripción y un monto válido."); return; }

        const compras = obtenerComprasLocal();
        compras.unshift({
            id: Date.now(),
            fecha: new Date().toLocaleDateString(),
            proveedor,
            desc,
            factura,
            monto
        });

        localStorage.setItem('compras_insumos_sistema', JSON.stringify(compras));
        alert("✅ Compra de insumos registrada.");
        cerrarModal('modalCompra');
        renderData();
    }

    function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

    window.onload = renderData;
</script>
</body>
</html>
